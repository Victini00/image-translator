# ============================================================================
# 일본어 인식 모델 v5 학습 설정
#
# v4(config/PP-OCRv5_mobile_rec.yml)와 달라진 것
#   - 학습 데이터: JParaCrawl(웹 문서) -> OpenSubtitles(영화·드라마 자막 대사)
#     src/data/opensubtitles_dataset_process.py + manga_dataset_generator.py로 생성
#   - 세로쓰기를 폰트 내장 세로 글리프로 렌더링(TRDG의 가짜 세로 모드 대체),
#     「……」「〜」「ー」가 실제 만화와 같은 모양으로 들어간다
#   - 폰트 3종 -> 8종, 스크린톤·열화 추가
#   - v4 가중치가 아니라 PP-OCRv5 사전학습 가중치에서 새로 시작한다.
#     v4는 학습 중 「…」를 한 번도 보지 못해 말줄임표를 출력하지 않도록 굳어
#     있었다(구두점 포함/제외 CER 차이 22%p). 사전학습 모델은 그 차이가 2%p라
#     그 편향이 없다.
#   - 에포크 30 -> 15 + 조기 종료, 워밍업 2 -> 0.5 에포크. v4는 검증 정확도가
#     3 에포크에서 최고(98.55%)를 찍고 4 에포크에서 떨어져 수동으로 멈췄다.
#     src/models/train_rec_early_stop.py로 실행하면 최소 5 에포크를 돈 뒤, 최고
#     정확도가 평가 6회(약 1 에포크) 연속 0.1%p 넘게 안 오르면 멈춘다.
#     코사인 스케줄은 epoch_num 기준으로 줄어들어서, 일찍 멈추면 lr이 덜 내려간
#     상태로 끝난다(예: 6 에포크에서 멈추면 최대치의 약 70%).
#   - 학습 중 평가는 검증셋 20만 장 중 2만 장(val_eval.txt)만 쓴다. v4에서는
#     평가가 학습 시간의 약 37%를 차지했다. 전체 val.txt는 최종 확인용.
#   - 배치 32 -> 16 (RTX 4070 12GB에서 학습). 배치 32는 A100에서도 13.2GB를 써서
#     4070에서는 VRAM이 넘쳐 공유 메모리로 새고 3.9초/배치까지 느려졌다(AMP로도
#     12GB 그대로). 배치 16은 6.4GB, 0.29초/배치(초당 약 54장)로 v4의 A100
#     배치 32(초당 52.6장)와 비슷하다. 스텝 수가 두 배가 되므로 평가 간격도 두 배로.
#
# 문자 사전(character_dict_path)은 v4와 같은 파일을 쓴다. 바꾸면 출력층 크기가
# 달라져 사전학습 가중치와 맞지 않고, 필요한 기호도 이미 들어 있다.
#
# 입력 너비 640은 v4에서 그대로 가져온 값이다(한 줄 12글자라 공식 설정의 320으로는
# 좁다). 이 너비에서는 PPLCNetV3의 마지막 풀링이 학습(40칸)과 추론(80칸)에서
# 어긋나므로, 반드시 아래 실행기로 돌려야 한다 - src/models/train_rec_entry.py가
# 학습 풀링을 추론과 같게 맞춘다. 자세한 실측은 그 파일 설명 참고.
#
# 실행 (저장소 루트에서, 조기 종료 포함):
#     python src/models/train_rec_early_stop.py --config config/PP-OCRv5_mobile_rec_v5.yml
# 조기 종료 없이 끝까지: external/PaddleOCR/tools 에서
#     python train.py -c ../../../config/PP-OCRv5_mobile_rec_v5.yml
# ============================================================================

Global:
  model_name: PP-OCRv5_mobile_rec_jp_fine_tuned_v5
  debug: false
  use_gpu: true
  epoch_num: 15
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./../../../models/ocr/PP-OCRv5_mobile_rec_jp_fine_tuned_v5
  save_epoch_step: 1
  eval_batch_step:
  - 0
  - 10000
  cal_metric_during_train: true
  pretrained_model: ./../../../models/ocr/PP-OCRv5_mobile_rec_pretrained.pdparams
  checkpoints: null
  save_inference_dir: ./../../../models/ocr/PP-OCRv5_mobile_rec_jp_fine_tuned_v5/complete_model
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: ./../../../data/processed/fine_tuning_answer_sheet_JParaCrawl_million/ppocrv5_dict.txt
  max_text_length: 20
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_ppocrv5.txt
  d2s_train_image_shape:
  - 3
  - 48
  - 640
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 1.0e-05
    warmup_epoch: 0.5
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 20
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ./../../../data/processed/fine_tuning_answer_sheet_Opensubtitles/
    ext_op_transform_idx: 1
    label_file_list:
    - ./../../../data/processed/fine_tuning_answer_sheet_Opensubtitles/train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
        image_shape:
        - 48
        - 640
        - 3
        max_text_length: 20
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales:
    - - 640
      - 48
    first_bs: 16
    fix_bs: false
    divided_factor:
    - 8
    - 16
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: true
    num_workers: 4
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./../../../data/processed/fine_tuning_answer_sheet_Opensubtitles/
    label_file_list:
    - ./../../../data/processed/fine_tuning_answer_sheet_Opensubtitles/val_eval.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 640
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 4
profiler_options: null
