# 학습 YAML 파일 예시

Global:
  model_name: PP-OCRv5_mobile_rec_jp_fine_tuned_v4
  debug: false
  use_gpu: true
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 20
  save_model_dir: ./../../../models/ocr/PP-OCRv5_mobile_rec_jp_fine_tuned_v4
  save_epoch_step: 5
  eval_batch_step:
  - 0
  - 5000
  cal_metric_during_train: true
  pretrained_model: ./../../../models/ocr/PP-OCRv5_mobile_rec_pretrained.pdparams
  checkpoints: null
  save_inference_dir: ./../../../models/ocr/PP-OCRv5_mobile_rec_v4
  use_visualdl: false
  infer_img: doc/imgs_words/ch/word_1.jpg
  character_dict_path: ./../../../data/processed/fine_tuning_answer_sheet_JParaCrawl_million/ppocrv5_dict.txt
  max_text_length: 20
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_ppocrv5.txt
  d2s_train_image_shape:
  - 3
  - 48
  - 640
Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 1.0e-05
    warmup_epoch: 2
  regularizer:
    name: L2
    factor: 3.0e-05
Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
    - CTCHead:
        Neck:
          name: svtr
          dims: 120
          depth: 2
          hidden_dims: 120
          kernel_size:
          - 1
          - 3
          use_guide: true
        Head:
          fc_decay: 1.0e-05
    - NRTRHead:
        nrtr_dim: 384
        max_text_length: 20
Loss:
  name: MultiLoss
  loss_config_list:
  - CTCLoss: null
  - NRTRLoss: null
PostProcess:
  name: CTCLabelDecode
Metric:
  name: RecMetric
  main_indicator: acc
Train:
  dataset:
    name: MultiScaleDataSet
    ds_width: false
    data_dir: ./../../../data/processed/fine_tuning_answer_sheet_JParaCrawl_million/
    ext_op_transform_idx: 1
    label_file_list:
    - ./../../../data/processed/fine_tuning_answer_sheet_JParaCrawl_million/train.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
        image_shape:
        - 48
        - 640
        - 3
        max_text_length: 20
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  sampler:
    name: MultiScaleSampler
    scales:
    - - 640
      - 48
    first_bs: 32
    fix_bs: false
    divided_factor:
    - 8
    - 16
    is_training: true
  loader:
    shuffle: true
    batch_size_per_card: 32
    drop_last: true
    num_workers: 4
Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./../../../data/processed/fine_tuning_answer_sheet_JParaCrawl_million/
    label_file_list:
    - ./../../../data/processed/fine_tuning_answer_sheet_JParaCrawl_million/val.txt
    transforms:
    - DecodeImage:
        img_mode: BGR
        channel_first: false
    - MultiLabelEncode:
        gtc_encode: NRTRLabelEncode
    - RecResizeImg:
        image_shape:
        - 3
        - 48
        - 640
    - KeepKeys:
        keep_keys:
        - image
        - label_ctc
        - label_gtc
        - length
        - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 4
profiler_options: null
